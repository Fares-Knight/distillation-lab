<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="420" viewBox="0 0 1040 420" role="img" aria-labelledby="title description">
  <title id="title">Flux de données de Distillation Lab</title>
  <desc id="description">La lecture ou l’instant choisi alimente stateAt(progress), qui produit un état immuable appliqué aux objets Three.js et aux textes et à la frise. La caméra et la sélection restent indépendantes de l’état scientifique et influencent le rendu et la fiche.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L7 4 L1 7" fill="none" stroke="#2d6557" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="interaction-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L7 4 L1 7" fill="none" stroke="#738278" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1040" height="420" rx="16" fill="#f5f7f2"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="24" y="34" font-size="12" font-weight="700" letter-spacing="1.6" fill="#53685b">UN INSTANT, DEUX APPLICATIONS</text>

    <g fill="none" stroke="#2d6557" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M208 136 H248" marker-end="url(#arrow)"/>
      <path d="M448 136 H488" marker-end="url(#arrow)"/>
      <path d="M672 136 H708 V94 H760" marker-end="url(#arrow)"/>
      <path d="M708 136 V212 H760" marker-end="url(#arrow)"/>
    </g>

    <g stroke="#c7d4c7" stroke-width="1.2">
      <rect x="24" y="88" width="184" height="96" rx="12" fill="#ffffff"/>
      <rect x="248" y="88" width="200" height="96" rx="12" fill="#e7f0e5" stroke="#82a28c"/>
      <rect x="488" y="88" width="184" height="96" rx="12" fill="#ffffff"/>
      <rect x="760" y="52" width="256" height="84" rx="12" fill="#ffffff"/>
      <rect x="760" y="170" width="256" height="84" rx="12" fill="#ffffff"/>
    </g>

    <g fill="#244c3d" text-anchor="middle">
      <text x="116" y="125" font-size="19" font-weight="600">Lecture ou</text>
      <text x="116" y="151" font-size="19" font-weight="600">instant choisi</text>
      <text x="348" y="131" font-family="Consolas, monospace" font-size="18" font-weight="600">stateAt(progress)</text>
      <text x="348" y="156" font-size="14" fill="#53685b">fonction pure</text>
      <text x="580" y="131" font-size="20" font-weight="600">État immuable</text>
      <text x="580" y="156" font-size="14" fill="#53685b">source scientifique</text>
      <text x="888" y="88" font-size="20" font-weight="600">Objets Three.js</text>
      <text x="888" y="113" font-size="14" fill="#53685b">niveaux, flux, particules</text>
      <text x="888" y="206" font-size="20" font-weight="600">Textes et frise</text>
      <text x="888" y="231" font-size="14" fill="#53685b">étape, fiche, avancement</text>
    </g>

    <g fill="none" stroke="#738278" stroke-width="1.8" stroke-dasharray="5 5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M724 326 H738 V126 H760" marker-end="url(#interaction-arrow)"/>
      <path d="M738 244 H760" marker-end="url(#interaction-arrow)"/>
    </g>
    <rect x="424" y="284" width="300" height="84" rx="12" fill="#eef1eb" stroke="#aab8ac" stroke-width="1.2"/>
    <text x="574" y="319" text-anchor="middle" font-size="20" font-weight="600" fill="#344f40">Caméra et sélection</text>
    <text x="574" y="344" text-anchor="middle" font-size="14" fill="#53685b">état d’interaction indépendant</text>
    <text x="758" y="300" font-size="14" fill="#53685b">Cadrage et sélection du rendu ;</text>
    <text x="758" y="322" font-size="14" fill="#53685b">composant présenté dans la fiche.</text>

    <text x="24" y="400" font-size="14" fill="#53685b">Les interactions ne modifient pas l’état scientifique.</text>
  </g>
</svg>
